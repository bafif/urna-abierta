/* ---------- Copied from apps/web/src/lib/tema.css (the parts these screens use) ---------- */
.pantalla { width: 100%; overflow: hidden; position: relative; background: var(--fondo); color: var(--texto); font-family: var(--f-texto); font-size: 19px; line-height: 1.35; }
.pantalla button, .pantalla input, .ventana button, .ventana input { font: inherit; color: inherit; }
.pantalla-in { height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }
.ic { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.cabeza { padding: 22px 20px 14px; position: relative; overflow: hidden; }
.atras { display: inline-flex; gap: 6px; align-items: center; background: none; border: 0; padding: 4px 0 10px; font-size: 17px; color: inherit; cursor: pointer; opacity: 0.9; }
.ojo { margin: 0 0 6px; font-family: var(--f-boton); font-size: 16px; font-weight: 600; color: var(--suave); }
.t1 { margin: 0; font-family: var(--f-titulo); font-weight: var(--peso-titulo); font-size: calc(33px * var(--escala-titulo)); line-height: var(--alto-titulo); letter-spacing: var(--tracking-titulo); }

})();
