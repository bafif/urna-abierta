name: Setup
description: Node 24, the pnpm that package.json names, and the workspace installed. pnpm's store is kept between runs, by the lockfile.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    - shell: bash
      run: corepack enable
    - id: store
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    # Only what pnpm downloads, which the lockfile pins with its hashes: nothing built here is reused.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-
    - shell: bash
      run: pnpm install --frozen-lockfile
