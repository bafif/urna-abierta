# Every suite in a job of its own, so that one that fails does not hide the others. The end to end ones build
# the real containers with Podman without root, as on a person's computer. CONTRIBUTING.md says how to run each.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # The release runs these first, and builds nothing if they fail.
  workflow_call:
  workflow_dispatch:
  # Once a week, also what does not run on each pull request, against what Ubuntu and the base images are by then.
  schedule:
    - cron: '23 6 * * 1'

# A new push to a pull request leaves the run of the previous one with nothing to say. Every other run has a group
# of its own: in a shared one, GitHub keeps only the newest waiting run, and a commit to main would go untested.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Each step runs even if one before it failed: they are independent.
      - if: ${{ !cancelled() }}
        run: pnpm --filter @urna-abierta/domain exec vitest run
      # The types of every package, its tests and end to end ones included.
      - if: ${{ !cancelled() }}
        run: pnpm -r --no-bail run check
      - if: ${{ !cancelled() }}
        run: pnpm --filter @urna-abierta/web exec vitest run
      - if: ${{ !cancelled() }}
        run: pnpm --filter @urna-abierta/installer exec vitest run
      - if: ${{ !cancelled() }}
        run: node deploy/verificar-contraste.mjs
      - if: ${{ !cancelled() }}
        run: sh deploy/server/prueba-estado.sh
      # Every document in Spanish and in English, with links that lead somewhere.
      - if: ${{ !cancelled() }}
        run: node deploy/verificar-documentos.mjs
      # The landing carries copies of the themes so visitors can try them: they must stay the app's.
      - if: ${{ !cancelled() }}
        run: cmp apps/web/src/lib/temas.js landing/temas.js && cmp apps/web/src/lib/aplicar-tema.js landing/aplicar-tema.js

  server:
    name: Server against Postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: urna
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: urna
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U urna" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://urna:prueba@localhost:5432/urna
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @urna-abierta/server exec vitest run

  # The Playwright report and the trace of each failure stay in the runner's temporary folder.
  app:
    name: The app in a browser (deploy/e2e.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/podman
      - run: deploy/e2e.sh
        env:
          URNA_E2E_INFORME: ${{ runner.temp }}/informe
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-app
          path: ${{ runner.temp }}/informe
          if-no-files-found: ignore
          retention-days: 14

  installer:
    name: The installer in a browser (deploy/e2e-instalador.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/podman
      - run: bash deploy/e2e-instalador.sh
        env:
          URNA_E2E_INFORME: ${{ runner.temp }}/informe
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-installer
          path: ${{ runner.temp }}/informe
          if-no-files-found: ignore
          retention-days: 14

  pasted:
    name: The pasted text, as a cloud runs it (apps/installer/e2e/texto.ts)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/podman
        with:
          room: 'true'
      - run: node apps/installer/e2e/texto.ts

  # The longest by far: two machines, an update, a failed one, a restore and a reboot. On main, once a week and
  # before each release; a pull request that touches the server's scripts says in its description that it ran it.
  ssh:
    name: Installing over SSH (apps/installer/e2e/servidor.ts)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/podman
        with:
          room: 'true'
      - run: node apps/installer/e2e/servidor.ts

  # The release builds the installers on each system and starts them before publishing; this does the same on every
  # push, so that one that does not start shows up here and not when a version is tagged (both Mac ones, v0.1.0 and
  # v0.1.1). The release skips it: its own installer job is this one.
  executable:
    name: The installer as a person downloads it (${{ matrix.os }})
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile --filter @urna-abierta/installer...
      - run: node build.mjs
        working-directory: apps/installer
      - name: Start it
        shell: bash
        working-directory: apps/installer
        run: |
          for asset in dist/urna-abierta-instalador-*; do
            case "$asset" in *.sha256) ;; *) node smoke.mjs "$asset" ;; esac
          done
