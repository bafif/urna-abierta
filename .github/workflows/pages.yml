# The landing is a static folder, published as it is on the gh-pages branch: nothing to compile
# and nothing that measures visitors. In the repo's settings, Pages serves that branch.
name: Landing

on:
  push:
    branches: [main]
    paths: ['landing/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the folder on its branch
        run: |
          git subtree split --prefix landing -b gh-pages
          git push origin gh-pages
