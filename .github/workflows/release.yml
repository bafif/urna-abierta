# Everything that gets published is built here, on GitHub's machines and never on a personal one,
# so that it carries no paths or machine names. Each file gets a SHA-256 and an attestation.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Oracle's free machines are ARM and AWS's are x86: every image is built for both.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/urna-abierta-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/urna-abierta-${{ matrix.image }}:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/urna-abierta-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  draft:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes

  installer:
    needs: draft
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --filter @urna-abierta/installer...
      - run: node build.mjs
        working-directory: apps/installer
        env:
          URNA_VERSION: ${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/installer/dist/urna-abierta-instalador-*
      - name: Add it to the release
        shell: bash
        working-directory: apps/installer/dist
        run: gh release upload "$GITHUB_REF_NAME" urna-abierta-instalador-*

  publish:
    needs: installer
    runs-on: ubuntu-24.04
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
