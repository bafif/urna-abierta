# Everything that gets published is built here, on GitHub's machines and never on a personal one,
# so that it carries no paths or machine names. Each file gets a SHA-256 and an attestation.
# The order matters: nothing is built if the tests fail, every installer is started before it is
# uploaded, and the release only goes public once anyone can download its images. docs/en/releasing.md
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  images:
    needs: tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Oracle's free machines are ARM and AWS's are x86: every image is built for both.
      # Only the version's tag here: «latest» moves when the release is published.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/urna-abierta-${{ matrix.image }}:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/urna-abierta-${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # One release for both languages: what to download, in Spanish and in English, above the changes GitHub lists.
  draft:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -e "s/{tag}/$GITHUB_REF_NAME/g" -e "s#{repo}#$GITHUB_REPOSITORY#g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --notes-file "$RUNNER_TEMP/notes.md"

  installer:
    needs: draft
    strategy:
      # One system failing does not cancel the others.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # The Intel Mac one did not start on v0.1.0: until it does, the release goes out without it.
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    env:
      URNA_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --filter @urna-abierta/installer...
      - run: node build.mjs
        working-directory: apps/installer
      # As a person gets it: unpacked, started without a browser, and asked for its screens.
      - name: Start it
        shell: bash
        working-directory: apps/installer
        run: |
          for asset in dist/urna-abierta-instalador-*; do
            case "$asset" in *.sha256) ;; *) node smoke.mjs "$asset" ;; esac
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: apps/installer/dist/urna-abierta-instalador-*
      - name: Add it to the release
        shell: bash
        working-directory: apps/installer/dist
        run: gh release upload "$GITHUB_REF_NAME" urna-abierta-instalador-*

  publish:
    needs: installer
    runs-on: ubuntu-24.04
    env:
      IMAGES: ghcr.io/${{ github.repository_owner }}/urna-abierta
    steps:
      # Without an account, as every server pulls them. A new package on GitHub starts private.
      - name: Anyone can download the images
        run: |
          for image in server web; do
            for arch in amd64 arm64; do
              if ! skopeo inspect --no-creds --override-os linux --override-arch "$arch" "docker://$IMAGES-$image:$GITHUB_REF_NAME" >/dev/null; then
                echo "::error::$IMAGES-$image:$GITHUB_REF_NAME cannot be pulled without an account ($arch). Make the package public once (Package settings, Change visibility, Public) and run this job again. See docs/en/releasing.md."
                exit 1
              fi
            done
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at this version
        run: |
          for image in server web; do
            docker buildx imagetools create -t "$IMAGES-$image:latest" "$IMAGES-$image:$GITHUB_REF_NAME"
          done
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
